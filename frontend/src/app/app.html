<div class="flex flex-col min-h-screen bg-white dark:bg-[#121214] text-zinc-900 dark:text-zinc-100 relative selection:bg-brand-green/20 selection:text-brand-green">
  <!-- Subtle Ambient Glows for Glassmorphic Depth -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
    <div class="absolute -top-32 -right-32 w-96 h-96 rounded-full bg-brand-green/10 dark:bg-brand-green/15 blur-3xl"></div>
    <div class="absolute top-1/3 -left-32 w-96 h-96 rounded-full bg-brand-orange/10 dark:bg-brand-orange/10 blur-3xl"></div>
    <div class="absolute -bottom-32 right-1/4 w-96 h-96 rounded-full bg-brand-green/5 dark:bg-brand-green/10 blur-3xl"></div>
  </div>

  <!-- Loading Progress Bar & Indicator -->
  <app-progress-bar></app-progress-bar>

  <app-navbar></app-navbar>

  <!-- Main layout with sidebar and content -->
  <div class="flex flex-grow pt-16">
    <!-- Sidebar for authenticated users -->
    @if (tokenService.isAuthenticated()) {
      <app-sidebar></app-sidebar>
    }

    <!-- Main content area with flex-col for persistent sticky bottom footer -->
    <main class="flex-grow p-4 md:p-6 lg:p-8 overflow-y-auto w-full transition-all duration-300 flex flex-col justify-between"
          [class.md:ml-64]="tokenService.isAuthenticated() && !ui.isSidebarCollapsed()"
          [class.md:ml-20]="tokenService.isAuthenticated() && ui.isSidebarCollapsed()">
      <div class="flex-grow">
        <router-outlet></router-outlet>
      </div>
      <app-footer></app-footer>
    </main>
  </div>

  <!-- Modals -->
  <app-login-modal></app-login-modal>
  <app-register-modal></app-register-modal>
</div>
