<nav class="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-gray-100 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-20">
      
      <!-- Logo -->
      <div class="flex-shrink-0 flex items-center cursor-pointer" routerLink="/">
        <div class="w-10 h-10 bg-[var(--color-brand-green)] rounded-lg flex items-center justify-center mr-3">
          <span class="text-white font-bold text-xl">Y</span>
        </div>
        <span class="font-bold text-xl tracking-tight text-gray-900">
          Yonna Akademia
        </span>
      </div>

      <!-- Links -->
      <div class="hidden md:flex space-x-8">
        <a routerLink="/" class="text-gray-900 font-medium hover:text-[var(--color-brand-green)] transition-colors">
          Inicio
        </a>
        <a href="#cultura" class="text-gray-600 font-medium hover:text-[var(--color-brand-green)] transition-colors">
          Cultura Wayuu
        </a>
      </div>

      <!-- Actions -->
      <div class="flex items-center space-x-4">
        @if (authService.isAuthenticated()) {
          <span class="text-sm text-gray-600 font-medium">¡Hola!</span>
          <button (click)="authService.logout()" class="text-sm font-medium text-red-600 hover:bg-red-50 px-4 py-2 rounded-lg transition-colors">
            Salir
          </button>
        } @else {
          <button (click)="openLogin()" class="text-gray-900 font-medium hover:bg-gray-100 px-4 py-2 rounded-lg transition-colors">
            Ingresar
          </button>
          <button (click)="openRegister()" class="bg-[var(--color-brand-green)] hover:bg-green-800 text-white font-medium px-5 py-2.5 rounded-lg shadow-sm hover:shadow-md transition-all">
            Crear Cuenta
          </button>
        }
      </div>
    </div>
  </div>
</nav>

<!-- Modals -->
<app-modal [isOpen]="isLoginModalOpen()" (closeModal)="closeModals()">
  <app-login 
    (onClose)="closeModals()" 
    (onSwitchToRegister)="openRegister()">
  </app-login>
</app-modal>

<app-modal [isOpen]="isRegisterModalOpen()" (closeModal)="closeModals()">
  <app-register 
    (onClose)="closeModals()" 
    (onSwitchToLogin)="openLogin()">
  </app-register>
</app-modal>
