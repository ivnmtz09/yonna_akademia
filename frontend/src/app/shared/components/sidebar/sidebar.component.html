<!-- Mobile Overlay -->
@if (ui.isSidebarOpen() && isMobile()) {
  <div class="fixed inset-0 bg-black/40 dark:bg-black/60 backdrop-blur-sm z-[45] transition-opacity" (click)="closeMobileSidebar()"></div>
}

<!-- Sidebar Desktop: fixed below navbar -->
<aside class="hidden md:flex fixed top-16 left-0 w-64 h-[calc(100vh-4rem)] z-40 bg-white/70 dark:bg-[#121214]/70 backdrop-blur-2xl border-r border-zinc-200/60 dark:border-zinc-800/80 flex-col overflow-y-auto">
  <!-- Sidebar Content -->
  <div class="flex flex-col h-full p-4">
    <!-- Navigation Links -->
    <nav class="flex-grow space-y-1.5 mt-2">
      <a routerLink="/dashboard" routerLinkActive="active"
         class="flex items-center gap-3 py-2.5 px-3.5 rounded-xl text-sm font-medium text-zinc-600 dark:text-zinc-400
                hover:bg-zinc-100/80 dark:hover:bg-zinc-800/60 hover:text-zinc-900 dark:hover:text-white transition-all">
        <lucide-icon name="layout-dashboard" class="w-4 h-4"></lucide-icon>
        <span>Dashboard</span>
      </a>
      <a routerLink="/diccionario" routerLinkActive="active"
         class="flex items-center gap-3 py-2.5 px-3.5 rounded-xl text-sm font-medium text-zinc-600 dark:text-zinc-400
                hover:bg-zinc-100/80 dark:hover:bg-zinc-800/60 hover:text-zinc-900 dark:hover:text-white transition-all">
        <lucide-icon name="book-open" class="w-4 h-4"></lucide-icon>
        <span>Diccionario</span>
      </a>
      <a routerLink="/cursos" routerLinkActive="active"
         class="flex items-center gap-3 py-2.5 px-3.5 rounded-xl text-sm font-medium text-zinc-600 dark:text-zinc-400
                hover:bg-zinc-100/80 dark:hover:bg-zinc-800/60 hover:text-zinc-900 dark:hover:text-white transition-all">
        <lucide-icon name="graduation-cap" class="w-4 h-4"></lucide-icon>
        <span>Cursos</span>
      </a>
      <a routerLink="/dashboard/perfil" routerLinkActive="active"
         class="flex items-center gap-3 py-2.5 px-3.5 rounded-xl text-sm font-medium text-zinc-600 dark:text-zinc-400
                hover:bg-zinc-100/80 dark:hover:bg-zinc-800/60 hover:text-zinc-900 dark:hover:text-white transition-all">
        <lucide-icon name="user" class="w-4 h-4"></lucide-icon>
        <span>Perfil</span>
      </a>
    </nav>
  </div>
</aside>

<!-- Sidebar Mobile: drawer style -->
<aside class="fixed inset-y-0 left-0 z-50 w-64 transform transition-transform duration-300 glass-modal border-r border-zinc-200/80 dark:border-zinc-800 md:hidden"
       [class.translate-x-0]="ui.isSidebarOpen()"
       [class.-translate-x-full]="!ui.isSidebarOpen()">
  <div class="flex flex-col h-full p-4">
    <!-- Mobile Header -->
    <div class="flex items-center justify-between mb-6 pb-3 border-b border-zinc-200/50 dark:border-zinc-800/60">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-green to-emerald-600 text-white flex items-center justify-center font-bold text-base shadow-sm">
          Y
        </div>
        <span class="text-xl font-display font-bold text-zinc-900 dark:text-white tracking-tight">Yonna Akademia</span>
      </div>
      <button (click)="closeMobileSidebar()" class="p-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800">
        <lucide-icon name="x" class="w-5 h-5"></lucide-icon>
      </button>
    </div>

    <!-- Navigation Links -->
    <nav class="flex-grow space-y-1.5">
      <a routerLink="/dashboard" routerLinkActive="active"
         class="flex items-center gap-3 py-2.5 px-3.5 rounded-xl text-sm font-medium text-zinc-600 dark:text-zinc-400
                hover:bg-zinc-100/80 dark:hover:bg-zinc-800/60 hover:text-zinc-900 dark:hover:text-white transition-all"
         (click)="closeMobileSidebar()">
        <lucide-icon name="layout-dashboard" class="w-4 h-4"></lucide-icon>
        <span>Dashboard</span>
      </a>
      <a routerLink="/diccionario" routerLinkActive="active"
         class="flex items-center gap-3 py-2.5 px-3.5 rounded-xl text-sm font-medium text-zinc-600 dark:text-zinc-400
                hover:bg-zinc-100/80 dark:hover:bg-zinc-800/60 hover:text-zinc-900 dark:hover:text-white transition-all"
         (click)="closeMobileSidebar()">
        <lucide-icon name="book-open" class="w-4 h-4"></lucide-icon>
        <span>Diccionario</span>
      </a>
      <a routerLink="/cursos" routerLinkActive="active"
         class="flex items-center gap-3 py-2.5 px-3.5 rounded-xl text-sm font-medium text-zinc-600 dark:text-zinc-400
                hover:bg-zinc-100/80 dark:hover:bg-zinc-800/60 hover:text-zinc-900 dark:hover:text-white transition-all"
         (click)="closeMobileSidebar()">
        <lucide-icon name="graduation-cap" class="w-4 h-4"></lucide-icon>
        <span>Cursos</span>
      </a>
      <a routerLink="/dashboard/perfil" routerLinkActive="active"
         class="flex items-center gap-3 py-2.5 px-3.5 rounded-xl text-sm font-medium text-zinc-600 dark:text-zinc-400
                hover:bg-zinc-100/80 dark:hover:bg-zinc-800/60 hover:text-zinc-900 dark:hover:text-white transition-all"
         (click)="closeMobileSidebar()">
        <lucide-icon name="user" class="w-4 h-4"></lucide-icon>
        <span>Perfil</span>
      </a>
    </nav>
  </div>
</aside>
