<section class="relative overflow-hidden bg-[var(--color-brand-light-green)] py-20 lg:py-32">
  <!-- Decoración de fondo -->
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
    <div class="absolute -top-[20%] -right-[10%] w-[70%] h-[70%] rounded-full bg-gradient-to-br from-white/40 to-transparent blur-3xl"></div>
    <div class="absolute -bottom-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-[var(--color-brand-green)]/5 blur-3xl"></div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative">
    <div class="grid lg:grid-cols-2 gap-12 lg:gap-8 items-center">
      
      <!-- Contenido de Texto -->
      <div class="max-w-2xl text-center lg:text-left mx-auto lg:mx-0">
        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight text-gray-900 mb-6 leading-tight">
          Protegiendo la <br class="hidden sm:block" />
          <span class="text-transparent bg-clip-text bg-gradient-to-r from-[var(--color-brand-green)] to-[var(--color-brand-orange)]">Memoria Viva Wayuu</span>
        </h1>
        <p class="text-lg sm:text-xl text-gray-600 mb-8 leading-relaxed max-w-xl mx-auto lg:mx-0">
          Un espacio digital para la preservación, aprendizaje y difusión del patrimonio cultural y lingüístico de la nación Wayuu.
        </p>
        
        <div class="flex flex-col sm:flex-row items-center justify-center lg:justify-start gap-4">
          <button class="w-full sm:w-auto bg-[var(--color-brand-orange)] hover:bg-orange-600 text-white font-medium px-8 py-4 rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all duration-200">
            Explorar Museo
          </button>
          <button class="w-full sm:w-auto bg-white hover:bg-gray-50 text-gray-900 font-medium px-8 py-4 rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition-all duration-200">
            Aprender Wayuunaiki
          </button>
        </div>
      </div>

      <!-- Imagen/Ilustración -->
      <div class="relative w-full h-full flex justify-center items-center mt-10 lg:mt-0 animate-in fade-in slide-in-from-right-8 duration-700">
        <!-- Placeholder para la ilustración del "Chivito" -->
        <div class="relative w-full max-w-md aspect-square rounded-[3rem] bg-gradient-to-tr from-[var(--color-brand-green)]/20 to-[var(--color-brand-orange)]/20 flex flex-col items-center justify-center shadow-2xl border-8 border-white transform rotate-3 hover:rotate-0 transition-transform duration-500">
          <div class="w-32 h-32 bg-white rounded-full flex items-center justify-center mb-6 shadow-inner">
            <span class="text-6xl text-[var(--color-brand-green)]">🐐</span>
          </div>
          <span class="text-2xl font-bold text-[var(--color-brand-green)] tracking-widest uppercase">Akademia</span>
        </div>
        
        <!-- Elementos flotantes decorativos -->
        <div class="absolute -top-6 -right-6 w-24 h-24 bg-white rounded-2xl shadow-xl flex items-center justify-center transform rotate-12 animate-bounce">
          <span class="text-3xl">🏺</span>
        </div>
        <div class="absolute -bottom-6 -left-6 w-20 h-20 bg-white rounded-full shadow-lg flex items-center justify-center transform -rotate-12">
          <span class="text-2xl">🌵</span>
        </div>
      </div>

    </div>
  </div>
</section>
