<section class="py-24 bg-white" id="cultura">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center max-w-3xl mx-auto mb-16">
      <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-4">Un Museo Digital Abierto</h2>
      <p class="text-lg text-gray-600">
        Explora las diferentes colecciones que preservan nuestra identidad y permiten que el legado Wayuu viaje por todo el mundo.
      </p>
    </div>

    <div class="grid md:grid-cols-3 gap-8">
      @for (feature of features; track feature.title) {
        <div class="group bg-white rounded-2xl p-8 border border-gray-100 shadow-sm hover:shadow-xl hover:-translate-y-2 transition-all duration-300">
          <div class="w-16 h-16 rounded-xl flex items-center justify-center text-3xl mb-6 shadow-sm group-hover:scale-110 transition-transform duration-300" [class]="feature.colorClass">
            {{ feature.icon }}
          </div>
          <h3 class="text-xl font-bold text-gray-900 mb-3">{{ feature.title }}</h3>
          <p class="text-gray-600 leading-relaxed mb-6">
            {{ feature.description }}
          </p>
          <a href="#" class="inline-flex items-center text-[var(--color-brand-green)] font-semibold hover:text-green-800 transition-colors">
            Ver colección
            <svg class="w-4 h-4 ml-1 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </a>
        </div>
      }
    </div>
  </div>
</section>
