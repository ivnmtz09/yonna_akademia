<div class="text-center mb-8">
  <h2 class="text-2xl font-bold text-gray-900">Bienvenido de nuevo</h2>
  <p class="text-gray-500 mt-2">Ingresa a tu cuenta de Yonna Akademia</p>
</div>

<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
  @if (errorMsg) {
    <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm">
      {{ errorMsg }}
    </div>
  }

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
    <input 
      type="email" 
      formControlName="email" 
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[var(--color-brand-green)] focus:border-[var(--color-brand-green)] outline-none transition-all"
      placeholder="correo@ejemplo.com"
    />
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
    <input 
      type="password" 
      formControlName="password" 
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[var(--color-brand-green)] focus:border-[var(--color-brand-green)] outline-none transition-all"
      placeholder="••••••••"
    />
  </div>

  <button 
    type="submit" 
    [disabled]="loginForm.invalid || isLoading"
    class="w-full bg-[var(--color-brand-orange)] hover:bg-orange-600 text-white font-medium py-2.5 rounded-lg transition-colors shadow-md hover:shadow-lg disabled:opacity-70 disabled:cursor-not-allowed flex justify-center items-center">
    @if (isLoading) {
      <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      Ingresando...
    } @else {
      Ingresar
    }
  </button>
</form>

<div class="mt-6 text-center text-sm text-gray-600">
  ¿No tienes cuenta? 
  <button (click)="onSwitchToRegister.emit()" class="text-[var(--color-brand-green)] font-semibold hover:underline">
    Crear cuenta
  </button>
</div>
